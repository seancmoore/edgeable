<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)" />
    <title>Edgeable — Verifiable Sports Picks</title>
    <meta name="description" content="Edgeable posts every pick before tip-off with a tamper-proof timestamp. Wins and losses, all public. See the full verified record." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Edgeable" />
    <meta property="og:title" content="Edgeable — Verifiable Sports Picks" />
    <meta property="og:description" content="Every pick posted before tip-off with a tamper-proof timestamp. Wins and losses, all public." />
    <meta property="og:url" content="https://edgeabled.web.app/" />
    <meta property="og:image" content="https://edgeabled.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:image" content="https://edgeabled.web.app/og-image.png" />
    <script>
      // Apply theme before paint to avoid flash
      (function () {
        try {
          var stored = localStorage.getItem('edgeable-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
